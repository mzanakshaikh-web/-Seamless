
name: Build Seamless APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source
        shell: bash
        run: |
          set -e

          ZIP_FILE="Seamless-Polished-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found."
            echo "Expected: $ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          if [ ! -f source/settings.gradle ]; then
            echo "ERROR: settings.gradle not found after extraction."
            find source -maxdepth 4 -type f
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Seamless APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: source

      - name: Upload Seamless APK
        uses: actions/upload-artifact@v4
        with:
          name: Seamless-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
